# Builds the signed app bundle (.aab) and uploads it to Google Play.
#
# Start it in either of two ways:
#   1. GitHub -> Actions -> "Play Store release" -> "Run workflow" (choose the track)
#   2. Push a version tag, e.g.  git tag v1.0.1  then  git push origin v1.0.1   (goes to "internal")
#
# Needed repository secrets (GitHub -> Settings -> Secrets and variables -> Actions):
#   KEYSTORE_BASE64             upload key (.jks) as base64
#   KEYSTORE_PASSWORD           keystore password
#   KEY_ALIAS                   key alias (e.g. asaan-upload)
#   KEY_PASSWORD                key password
#   GOOGLE_SERVICES_JSON_BASE64 app/google-services.json as base64
#   GEMINI_API_KEY              Gemini key used by the AI assistants
#   PLAY_SERVICE_ACCOUNT_JSON   Google Play service account key (the whole JSON text)
# See GITHUB_PLAY_RELEASE_GUIDE.md for how to create each one.

name: Play Store release

on:
  workflow_dispatch:
    inputs:
      track:
        description: "Play Store track"
        required: true
        default: internal
        type: choice
        options:
          - internal
          - alpha
          - beta
          - production
      status:
        description: "completed = release goes out on that track; draft = you finish it in Play Console"
        required: true
        default: completed
        type: choice
        options:
          - completed
          - draft
  push:
    tags:
      - "v*"

# Never run two uploads at the same time
concurrency: play-release

jobs:
  release:
    runs-on: ubuntu-latest
    timeout-minutes: 45

    steps:
      - name: Get the code
        uses: actions/checkout@v5

      - name: Set up Java 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Version number
        run: |
          # Every upload needs a higher versionCode than the last one.
          # 100 + run number keeps it above the first, manually uploaded build (versionCode 1).
          echo "VERSION_CODE=$((100 + GITHUB_RUN_NUMBER))" >> "$GITHUB_ENV"
          if [[ "$GITHUB_REF" == refs/tags/v* ]]; then
            echo "VERSION_NAME=${GITHUB_REF_NAME#v}" >> "$GITHUB_ENV"
          else
            echo "VERSION_NAME=1.0.$GITHUB_RUN_NUMBER" >> "$GITHUB_ENV"
          fi

      - name: Put secrets in place (only on this temporary machine)
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
          GOOGLE_SERVICES_JSON_BASE64: ${{ secrets.GOOGLE_SERVICES_JSON_BASE64 }}
        run: |
          echo "$KEYSTORE_BASE64" | base64 --decode > asaan-upload.jks
          {
            echo "storeFile=asaan-upload.jks"
            echo "storePassword=$KEYSTORE_PASSWORD"
            echo "keyAlias=$KEY_ALIAS"
            echo "keyPassword=$KEY_PASSWORD"
          } > keystore.properties
          echo "$GOOGLE_SERVICES_JSON_BASE64" | base64 --decode > app/google-services.json

      - name: Build signed app bundle
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
        run: |
          chmod +x gradlew
          ./gradlew :app:bundleRelease --no-daemon --stacktrace

      - name: Keep the .aab and mapping file (downloadable from this run)
        uses: actions/upload-artifact@v4
        with:
          name: app-release-${{ env.VERSION_NAME }}-${{ env.VERSION_CODE }}
          path: |
            app/build/outputs/bundle/release/app-release.aab
            app/build/outputs/mapping/release/mapping.txt
          retention-days: 30

      - name: Upload to Google Play
        uses: r0adkll/upload-google-play@v1
        with:
          serviceAccountJsonPlainText: ${{ secrets.PLAY_SERVICE_ACCOUNT_JSON }}
          packageName: com.assan.finance
          releaseFiles: app/build/outputs/bundle/release/app-release.aab
          mappingFile: app/build/outputs/mapping/release/mapping.txt
          track: ${{ inputs.track || 'internal' }}
          status: ${{ inputs.status || 'completed' }}

      - name: Remove secrets from the machine
        if: always()
        run: rm -f asaan-upload.jks keystore.properties app/google-services.json
